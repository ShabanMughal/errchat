[project]
name = "errchat-server"
version = "0.1.0"
description = "Local server that turns chat context into reply suggestions and grammar fixes via the Claude Code CLI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["errchat_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>errchat options</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 16px; min-width: 320px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 10px 0; }
    input[type="number"], select { width: 120px; font: inherit; }
    .hint { color: GrayText; font-size: 12px; margin: 0 0 12px; }
    #status { color: GrayText; font-size: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <label>Reply suggestions <input type="checkbox" id="suggestEnabled"></label>
  <label>Grammar correction <input type="checkbox" id="correctEnabled"></label>
  <label>Tone
    <select id="tone">
      <option value="match">Match my style</option>
      <option value="casual">Casual</option>
      <option value="friendly">Friendly</option>
      <option value="formal">Formal</option>
    </select>
  </label>
  <label>Number of suggestions <input type="number" id="count" min="1" max="5"></label>
  <label>Server port <input type="number" id="port" min="1" max="65535"></label>
  <p class="hint">Must match ERRCHAT_PORT on the server (default 8787).</p>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
